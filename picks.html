<main>
  <section class="plist-hero">
    <div class="wrap">
      <div class="eyebrow">Curated list</div>
      <h1>Danny's picks</h1>
      <p class="lede" style="color:var(--ink)">Things our family actually uses and loves. Every link goes to Amazon.</p>
      <nav class="jump" id="jump" aria-label="Lists"></nav>
    </div>
  </section>
  <div id="lists"></div>
  <div class="wrap"><p class="affil">As an Amazon Associate, Dellis earns from qualifying purchases.</p></div>
</main>

<footer>
  <div class="wrap">
    <div>
      <img class="flogo logo" alt="Dellis" width="136" height="56">
      <p style="margin-top:8px"><span class="email" id="footEmail"></span><br><span id="footLoc"></span></p>
    </div>
    <nav class="socials" id="socials" aria-label="Dellis elsewhere"></nav>
    <p class="fine">© <span id="yr"></span> Dellis. Supporting neurodiversity through stories, music and merch.</p>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function(){
  const D = window.DELLIS, L = D.links;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const ext = 'target="_blank" rel="noopener"';
  $("#jump").innerHTML = D.picks.map(p => `<a class="btn btn-line btn-small" href="#${p.id}">${esc(p.title)}</a>`).join("");
  $("#lists").innerHTML = D.picks.map(p => `
    <section class="plist" id="${p.id}">
      <div class="wrap">
        <div class="plist-head">
          <img src="${p.image}" alt="">
          <div><h2>${esc(p.title)}</h2><p class="lede">${esc(p.blurb)}</p>${p.note ? `<p class="disclaim">${esc(p.note)}</p>` : ""}</div>
        </div>
        <div class="items">${p.items.map(i => `
          <div class="pitem"><h3>${esc(i.name)}</h3><p>${esc(i.note)}</p>
            <a class="btn btn-main btn-small arrow" href="${i.link}" ${ext}>Buy on Amazon</a></div>`).join("")}
        </div>
      </div>
    </section>`).join("");
  document.querySelectorAll("img.logo").forEach(i => i.src = D.logo);
  ["#footEmail"].forEach(s => $(s) && ($(s).textContent = L.email));
  $("#footLoc").textContent = L.location;
  $("#yr").textContent = new Date().getFullYear();
  const I = D.icons;
  $("#socials").innerHTML = [["Spotify", L.spotify, I.spotify],
    ["Apple Music", L.appleMusic, I.appleMusic], ["YouTube", L.youtube, I.youtube], ["Amazon", D.series.link, I.amazon],
    ["Facebook", L.facebook, I.facebook], ["LinkedIn", L.linkedin, I.linkedin]]
    .map(([n, u, ic]) => `<a href="${u}" ${ext} aria-label="${esc(n)}" title="${esc(n)}"><img src="${ic}" alt=""></a>`).join("");
  const jumpToHash = () => { const t = location.hash && document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView({ behavior: "instant" }); };
  jumpToHash();
  window.addEventListener("load", jumpToHash);
})();
</script>
</body>
</html>
